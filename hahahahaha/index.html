<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000">
  <title>hahahahaha</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
    }

    body {
      overflow-x: hidden;
    }

    #soundToggle {
      position: fixed;
      z-index: 10;
      top: 12px;
      right: 12px;
      width: min(662px, calc(100vw - 24px));
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    #soundToggle img {
      display: block;
      width: 100%;
      height: auto;
    }

    #videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
      gap: 4px;
      width: 100%;
      padding: 0;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100vh;
      object-fit: contain;
      background: #000;
    }

    @media (max-width: 600px) {
      #videos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <button id="soundToggle" type="button" aria-label="Turn sound on">
    <img
      src="https://images.cooltext.com/5766486.gif"
      width="662"
      height="106"
      alt="Dźwięk tak czy nie">
  </button>

  <main id="videos" aria-label="Videos"></main>

  <script>
    const owner = "Mikon203";
    const repo = "mikonlol";
    const branch = "main";
    const folder = "hahahahaha";

    const videoExtensions = new Set([
      "mp4", "m4v", "webm", "ogv", "ogg", "mov", "mkv",
      "avi", "mpg", "mpeg", "3gp", "3g2", "ts", "mts", "m2ts"
    ]);

    const gallery = document.querySelector("#videos");
    const soundToggle = document.querySelector("#soundToggle");

    let soundEnabled = false;
    const players = [];

    function isVideo(path) {
      return videoExtensions.has(path.split(".").pop().toLowerCase());
    }

    function rawUrl(path) {
      return "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" +
        branch + "/" + path.split("/").map(encodeURIComponent).join("/");
    }

    function addVideo(path) {
      const player = document.createElement("video");

      player.autoplay = true;
      player.muted = true;
      player.defaultMuted = true;
      player.loop = true;
      player.playsInline = true;
      player.preload = "auto";
      player.disablePictureInPicture = true;
      player.src = rawUrl(path);

      player.addEventListener("canplay", () => {
        player.play().catch(() => {});
      });

      gallery.appendChild(player);
      players.push(player);
    }

    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;

      players.forEach(player => {
        player.muted = !soundEnabled;

        if (soundEnabled) {
          player.play().catch(() => {});
        }
      });

      soundToggle.setAttribute(
        "aria-label",
        soundEnabled ? "Turn sound off" : "Turn sound on"
      );
    });

    async function loadVideos() {
      try {
        const response = await fetch(
          "https://api.github.com/repos/" + owner + "/" + repo +
          "/git/trees/" + branch + "?recursive=1"
        );

        if (!response.ok) return;

        const data = await response.json();
        if (data.truncated) return;

        const prefix = folder + "/";
        const files = (data.tree || [])
          .filter(item =>
            item.type === "blob" &&
            item.path.startsWith(prefix) &&
            isVideo(item.path)
          )
          .sort((a, b) => a.path.localeCompare(b.path));

        files.forEach(file => addVideo(file.path));
      } catch (error) {
        console.error("Couldn't load videos:", error);
      }
    }

    loadVideos();
  </script>
</body>
</html>
