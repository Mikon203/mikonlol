<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111">
  <title>hahahahaha</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      color: #f5f5f5;
      background: #111;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { width: min(1100px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: clamp(2rem, 6vw, 4rem); }
    #status { color: #aaa; margin: 0 0 28px; }
    #videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: 22px;
    }
    article { min-width: 0; padding: 12px; background: #1c1c1c; border: 1px solid #333; }
    video { display: block; width: 100%; max-height: 70vh; background: #000; }
    article a { display: block; margin-top: 9px; color: #ddd; overflow-wrap: anywhere; }
    .empty { padding: 22px; border: 1px solid #333; color: #bbb; }
  </style>
</head>
<body>
  <main>
    <h1>hahahahaha</h1>
    <p id="status">Looking for videos...</p>
    <section id="videos" aria-live="polite"></section>
  </main>
  <script>
    const owner = "Mikon203";
    const repo = "mikonlol";
    const branch = "main";
    const folder = "hahahahaha";
    const videoExtensions = new Set([
      "mp4", "m4v", "webm", "ogv", "ogg", "mov", "mkv",
      "avi", "mpg", "mpeg", "3gp", "3g2", "ts", "mts", "m2ts"
    ]);

    const status = document.querySelector("#status");
    const gallery = document.querySelector("#videos");

    function isVideo(path) {
      const extension = path.split(".").pop().toLowerCase();
      return videoExtensions.has(extension);
    }

    function rawUrl(path) {
      return "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" +
        branch + "/" + path.split("/").map(encodeURIComponent).join("/");
    }

    function showVideo(path) {
      const url = rawUrl(path);
      const card = document.createElement("article");
      const player = document.createElement("video");
      player.controls = true;
      player.preload = "metadata";
      player.playsInline = true;
      player.src = url;

      const link = document.createElement("a");
      link.href = url;
      link.textContent = path.slice(folder.length + 1);
      link.target = "_blank";
      link.rel = "noopener";

      card.append(player, link);
      gallery.append(card);
    }

    async function loadVideos() {
      try {
        const response = await fetch(
          "https://api.github.com/repos/" + owner + "/" + repo +
          "/git/trees/" + branch + "?recursive=1"
        );

        if (!response.ok) {
          throw new Error("GitHub returned HTTP " + response.status);
        }

        const data = await response.json();
        if (data.truncated) {
          throw new Error("GitHub's file listing was truncated.");
        }

        const prefix = folder + "/";
        const files = (data.tree || [])
          .filter(item => item.type === "blob" &&
            item.path.startsWith(prefix) && isVideo(item.path))
          .sort((a, b) => a.path.localeCompare(b.path));

        if (!files.length) {
          status.textContent = "No videos found in /" + folder + " yet.";
          gallery.innerHTML = '<p class="empty">Drop video files into the hahahahaha folder on GitHub and refresh this page.</p>';
          return;
        }

        status.textContent = files.length + " video" +
          (files.length === 1 ? "" : "s") + " found.";
        files.forEach(file => showVideo(file.path));
      } catch (error) {
        status.textContent = "Couldn't load the videos: " + error.message;
      }
    }

    loadVideos();
  </script>
</body>
</html>
