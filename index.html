<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mikon.lol</title>
<style>
html,body{margin:0;padding:0;height:100%}
.row{display:flex;align-items:center;justify-content:center;gap:72px;min-height:100vh;padding:20px}
.pick{position:relative;width:380px;max-width:42vw}
.pick img{display:block;width:100%;height:auto}.pick a.cover{position:absolute;inset:0;z-index:5}
@media(max-width:600px){.row{flex-direction:column;gap:36px}.pick{width:300px;max-width:80vw}}
</style>
</head>
<body>
<div class="row">

  <div class="pick">
    <img src="https://media.tenor.com/fMLiY2ddeP8AAAAj/flag-poland.gif" alt="Waving Polish flag" width="380" height="355">
    <a class="cover" href="https://mikon.lol/pl" aria-label="PL"></a>
  </div>

  <div class="pick">
    <img src="https://media1.tenor.com/m/9l-sr-rfEVYAAAAd/god-bless-america.gif" alt="Waving American flag" width="380" height="285">
    <a class="cover" href="https://mikon.lol/en" aria-label="EN"></a>
  </div>

</div>
<script>
const theme = localStorage.getItem("mikonlol-easter-egg-theme");
if (theme === "kasti" || theme === "opsec") {
  document.documentElement.style.backgroundImage = `url("/${theme}.gif")`;
  document.documentElement.style.backgroundSize = "100% 100%";
  document.documentElement.style.backgroundPosition = "center";
  document.documentElement.style.backgroundAttachment = "fixed";
}
</script>
</body>
</html>
